<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ariana’s Quests</title>
<meta name="theme-color" content="#7A5CFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Quests">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">
  <header id="top">
    <button class="pill" id="homeBtn" aria-label="Home">🏠</button>
    <div class="brand">Word Quest</div>
    <span class="pill" id="stars">⭐ 0</span>
    <span class="pill" id="clock" aria-label="Time spent" hidden>00:00</span>
    <button class="pill" id="snd" aria-label="Sound on or off">🔊</button>
  </header>
  <div id="questChrome" hidden>
    <ul id="track"></ul>
    <div class="bar" aria-hidden="true"><i id="timebar"></i></div>
  </div>

  <section id="coach" aria-live="polite">
    <div id="mascot">
    <svg id="owl" viewBox="0 0 100 100" aria-hidden="true">
      <path d="M20 54 Q8 76 28 90 Q26 72 29 56Z" fill="var(--owl-dark)"/>
      <path d="M80 54 Q92 76 72 90 Q74 72 71 56Z" fill="var(--owl-dark)"/>
      <ellipse cx="50" cy="58" rx="30" ry="34" fill="var(--owl)"/>
      <path d="M24 32 L29 10 L43 27Z" fill="var(--owl)"/>
      <path d="M76 32 L71 10 L57 27Z" fill="var(--owl)"/>
      <ellipse cx="50" cy="70" rx="19" ry="21" fill="var(--belly)"/>
      <circle cx="38" cy="43" r="12" fill="#fff"/>
      <circle cx="62" cy="43" r="12" fill="#fff"/>
      <circle cx="39" cy="44" r="5.5" fill="#241B5A"/>
      <circle cx="61" cy="44" r="5.5" fill="#241B5A"/>
      <circle cx="41" cy="42" r="1.8" fill="#fff"/>
      <circle cx="63" cy="42" r="1.8" fill="#fff"/>
      <circle cx="38" cy="43" r="14" fill="none" stroke="#FFB42E" stroke-width="2.5"/>
      <circle cx="62" cy="43" r="14" fill="none" stroke="#FFB42E" stroke-width="2.5"/>
      <path d="M45 53 L55 53 L50 63Z" fill="#FFB42E"/>
      <ellipse cx="40" cy="94" rx="7" ry="3.5" fill="#FFB42E"/>
      <ellipse cx="60" cy="94" rx="7" ry="3.5" fill="#FFB42E"/>
        </svg>
    <svg id="pig" viewBox="0 0 100 100" aria-hidden="true" hidden>
      <path d="M26 40 L22 18 L42 30Z" fill="#FF6F9C"/>
      <path d="M74 40 L78 18 L58 30Z" fill="#FF6F9C"/>
      <ellipse cx="50" cy="60" rx="36" ry="30" fill="#FF8FB1"/>
      <rect x="38" y="31" width="24" height="5" rx="2.5" fill="#C2185B"/>
      <circle cx="50" cy="17" r="10" fill="#FFB42E" stroke="#C98300" stroke-width="2.5"/>
      <text x="50" y="22" text-anchor="middle" font-size="14" font-weight="800" fill="#C98300" font-family="sans-serif">₹</text>
      <circle cx="36" cy="52" r="8" fill="#fff"/><circle cx="64" cy="52" r="8" fill="#fff"/>
      <circle cx="37" cy="53" r="4" fill="#241B5A"/><circle cx="63" cy="53" r="4" fill="#241B5A"/>
      <circle cx="38.5" cy="51.5" r="1.4" fill="#fff"/><circle cx="64.5" cy="51.5" r="1.4" fill="#fff"/>
      <ellipse cx="50" cy="70" rx="15" ry="10" fill="#FFC2D6"/>
      <ellipse cx="45" cy="70" rx="2.5" ry="3.5" fill="#C2185B"/><ellipse cx="55" cy="70" rx="2.5" ry="3.5" fill="#C2185B"/>
      <ellipse cx="32" cy="90" rx="8" ry="4" fill="#FF6F9C"/><ellipse cx="68" cy="90" rx="8" ry="4" fill="#FF6F9C"/>
    </svg>
  </div>
    <div class="bubble">
      <p id="bubbleText"></p>
      <div class="tools">
        <button class="mini" id="hearBtn" aria-label="Read aloud">🔊 Hear</button>
        <button class="mini" id="helpBtn" hidden>💡 Help me</button>
        <button class="mini" id="askBtn" hidden>💬 Ask Hooty</button>
      </div>
    </div>
  </section>

  <main id="stage"></main>
</div>

<div id="sheet" hidden>
  <div class="box" role="dialog" aria-label="Ask Hooty">
    <h3>Ask Hooty</h3>
    <p class="tiny">Ask about a word, a rule, or how to say something.</p>
    <div class="chips" id="askChips"></div>
    <input class="field" id="askInput" type="text" maxlength="200" placeholder="Type your question…" autocomplete="off" style="margin-top:12px">
    <div class="actions" style="margin-top:12px">
      <button class="btn alt" id="askCancel">Close</button>
      <button class="btn" id="askSend">Ask</button>
    </div>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="/maths.js"></script>
<script src="/app.js"></script>
</body>
</html>
